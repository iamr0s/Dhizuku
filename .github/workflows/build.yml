name: Build

on:
  push:
    paths-ignore:
      - docs/**
      - fastlane/**
      - LICENSE
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set environments
        run: |
          {
            echo "repo=$(echo ${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/})"
            echo "version=v$(grep versionName version.properties | awk -F\= '{print $2}')"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
          } >> $GITHUB_ENV

      - name: Cache Dhizuku API
        id: dhizuku-server-api
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/Dhizuku-API/Dhizuku-SERVER_API/0.2.0
          key: dhizuku-server-api-0.2.0

      - name: Checkout API
        if: steps.dhizuku-server-api.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: iamr0s/Dhizuku-API
          path: api

      - name: Build AAR
        if: steps.dhizuku-server-api.outputs.cache-hit != 'true'
        working-directory: api
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Build APK
        run: |
          ./gradlew --no-daemon --warning-mode=all assembleDebug
          cp -f app/build/outputs/apk/debug/app-debug.apk ${{ env.repo }}-${{ env.version }}@${{ env.commit }}.apk

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.repo }}-${{ env.version }}@${{ env.commit }}
          path: ${{ env.repo }}-${{ env.version }}@${{ env.commit }}.apk
